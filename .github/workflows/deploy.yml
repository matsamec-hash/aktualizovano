name: Deploy to Hostinger

on:
  push:
    branches: [master]
  schedule:
    # Rebuild daily at 7:30 UTC (30 min after CMS article generation cron)
    - cron: "30 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:reconnect-interval-base 10;
            open -u $FTP_USER,$FTP_PASS $FTP_HOST;
            mirror --reverse --only-newer --parallel=2 dist/ /public_html/;
          "

      - name: Ping IndexNow (Bing / Seznam / Yandex)
        # IndexNow notifikace o změnách. Klíč je veřejný (key file v public/),
        # proto v repu, ne v secrets. Fan-out endpoint rozešle všem účastníkům
        # (vč. Seznam.cz). Selhání NESMÍ shodit deploy → || true.
        env:
          INDEXNOW_KEY: "2bb241c4b61fde1a505e5e66ae3b7988"
        run: |
          HOST="aktualizovano.cz"
          # Vytáhni všechny <loc> URL ze sitemap (max 10000/request).
          URLS=$(grep -oE '<loc>[^<]+</loc>' dist/sitemap-0.xml | sed -E 's#</?loc>##g')
          COUNT=$(printf '%s\n' "$URLS" | grep -c . || true)
          echo "Submitting $COUNT URLs to IndexNow"
          PAYLOAD=$(printf '%s\n' "$URLS" | jq -R . | jq -s \
            --arg host "$HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg loc "https://$HOST/$INDEXNOW_KEY.txt" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:.}')
          curl -s -m 30 -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" -w "IndexNow HTTP %{http_code}\n" || true
